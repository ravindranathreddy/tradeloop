# Scheduled events that can move the Indian index (used by research and, later, a trade filter).
#
# when:   in_session   announced while NSE is open (RBI ~10:00 IST, Budget 11:00, election counting
#                      from the morning), so the reaction is that same day
#         after_close  announced after the Indian close (FOMC decision is ~00:30 IST), so the
#                      reaction is the next trading day
# effect: optional; the first Indian session that reacts, when it isn't simply derived (the three
#         Budgets presented on a weekend: NSE held a special session, our candles confirm it)
# source: official  federalreserve.gov (FOMC 2021-26), rbi.org.in (2026 decisions, Dec 2026 scheduled)
#         news      checked against news reports or Wikipedia
#         recalled  written from memory, NOT checked: Ranga to verify before relying on it
# Not included: US CPI/jobs data, state elections, exchange or SEBI circulars, unscheduled shocks.
# Add the next year's RBI and FOMC dates when published.
