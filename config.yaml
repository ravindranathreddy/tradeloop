db_path: data/ticks.db
end_time: "15:41"        # IST; recorder exits after this (F&O closes 15:40 from 3 Aug 2026)
poll_seconds: 0.5
stale_seconds: 10        # no new data this long -> rebuild the feed connection (normal silence is under 3 s;
                         # the paper broker won't fill from a book older than 10 s)
min_free_gb: 5           # refuse to start / stop cleanly below this much free disk
record_depth: true       # top-5 bid/ask; needed later for realistic paper fills

underlyings:
  - name: NIFTY          # index IDs, e.g. NSE|NIFTY|IDX; feed tokens live in brokers/groww.py
    exchange: NSE
    strikes_each_side: 25  # ~5.5% each side: covers the put credit spread's protective put
    recenter_points: 200 # add strikes if spot moves this far from the last selection
  - name: SENSEX
    exchange: BSE
    strikes_each_side: 36  # 100-pt strikes: ~5% each side, covers the protective put
    recenter_points: 600

# Paper trading (step 7): these strategies trade on the live feed against the recorded
# order book. No real orders. See tradeloop/paper.py.
paper:
  - strategies/put_credit_spread.yaml
  - strategies/put_credit_spread_sensex.yaml   # lower-confidence trial, see its memo
paper_db: data/paper.db
paper_max_lots: 1

# Watchdog (tradeloop/watchdog.py): trips the kill switch on hard rules.
watchdog:
  stale_seconds: 120        # no tick this long, with positions open
  max_open_loss: 20000      # rupees per strategy on open positions; one lot's worst case is Rs 14-27k
  heartbeat_file: data/heartbeat

# Phone alerts (tradeloop/alerts.py): every "ALERT" log line goes to Telegram, with Gmail as the
# backup and for critical ones. Secrets are in .env. Test: python -m tradeloop.alerts test
alerts:
  enabled: true
  dedupe_seconds: 300       # the same alert repeats at most this often
  max_per_minute: 10        # a flood is cut off here
  state_file: data/alert_state.json

# Live trading through the Groww adapter (tradeloop/live_broker.py). OFF. Nothing here sends a real
# order until BOTH enabled and armed are true, and arming is Ranga's decision (see LIVE_CHECKLIST.md).
live:
  enabled: false
  armed: false              # true = real orders. Never changed by Claude.
  strategies: [strategies/put_credit_spread.yaml]
  db: data/live.db          # live ledger, separate from paper
  max_lots: 1
  order_wait_minutes: 2     # cancel an order unfilled this long
  buffer_ticks: 4           # a market order goes out as a limit this many ticks through the book
  margin_buffer: 1.5        # free margin must cover the extra margin x this (expiry-day margin is higher than entry)
  margin_min_free: 90000    # free option-selling margin needed before a new spread starts (about 1.5x Rs 60k)
  max_margin: 100000        # cap on the book's total margin; a naked short (about Rs 125k) can never pass
